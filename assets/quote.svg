
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 150" width="820" height="150">

  <defs>
    <linearGradient id="q-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#09090b"/>
      <stop offset="50%" stop-color="#120608"/>
      <stop offset="100%" stop-color="#070709"/>
    </linearGradient>

    <linearGradient id="q-border" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#7f1d1d"/>
      <stop offset="50%" stop-color="#ef4444"/>
      <stop offset="100%" stop-color="#7f1d1d"/>
    </linearGradient>

    <filter id="q-glow">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Card Background -->
  <rect width="820" height="150" rx="10"
        fill="url(#q-bg)"
        stroke="url(#q-border)"
        stroke-width="1.2"/>

  <!-- Corner Cyber Accents -->
  <path d="M 8 20 L 8 8 L 20 8" stroke="#ff2a45" stroke-width="2.5" fill="none" stroke-linecap="round"/>
  <path d="M 812 20 L 812 8 L 800 8" stroke="#ff2a45" stroke-width="2.5" fill="none" stroke-linecap="round"/>
  <path d="M 8 130 L 8 142 L 20 142" stroke="#ff2a45" stroke-width="2.5" fill="none" stroke-linecap="round"/>
  <path d="M 812 130 L 812 142 L 800 142" stroke="#ff2a45" stroke-width="2.5" fill="none" stroke-linecap="round"/>

  <!-- Big Quote Mark -->
  <text x="32" y="57"
        font-family="Georgia, serif"
        font-size="44"
        font-weight="bold"
        fill="#ff2a45"
        opacity="0.9"
        filter="url(#q-glow)">&#8220;</text>

  <!-- Quote Text -->
  <text x="64" y="43"
        font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif"
        font-size="15"
        font-style="italic"
        font-weight="500"
        fill="#f1f5f9">

    <tspan x="64" dy="0">The future is not something we simply wait for;</tspan>
    <tspan x="64" dy="23">it is something we imagine, engineer, and bring</tspan>
    <tspan x="64" dy="23">into existence through innovation.&#8221;</tspan>

  </text>

  <!-- Attribution -->
  <text x="760" y="128"
        text-anchor="end"
        font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif"
        font-size="13"
        font-weight="600"
        fill="#ef4444"
        letter-spacing="1">
    &#8212; Beyond Tomorrow
  </text>

</svg>
